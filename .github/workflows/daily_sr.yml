name: SR dos veces al día (Cronos → Thanatos → Zeus)

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 07:00 America/Mexico_City (UTC-6), lunes a viernes — turno "am"
    - cron: "0 21 * * 1-5"   # 15:00 America/Mexico_City (UTC-6), lunes a viernes — turno "pm"
  workflow_dispatch:
    inputs:
      scope:
        description: "all | project:PRJ0001,program:PRG001,portfolio:PFL001"
        default: "all"
      dry_run:
        description: "true = no envía (deja mensajes en el artefacto)"
        type: choice
        options: ["true", "false"]
        default: "true"
      as_of:
        description: "Fecha de corte YYYY-MM-DD (vacío = hoy)"
        default: ""

concurrency:
  group: sr-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sr:
    # Runner hospedado por GitHub NO alcanza una BD local/LAN. Para la réplica local, registra un
    # self-hosted runner en ese equipo y define la variable de repo RUNNER_LABEL=self-hosted.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      TZ: America/Mexico_City
      # DB_SOURCE=demo (default) usa la BD sintética; DB_SOURCE=real usa DB_URL o DATABASE_URL.
      # La BD del curso (alumnos-pgbouncer) solo es alcanzable desde el servidor del curso:
      # activar 'real' únicamente con un self-hosted runner que la alcance (RUNNER_LABEL).
      DB_SOURCE: ${{ vars.DB_SOURCE || 'demo' }}
      DB_URL: ${{ secrets.DB_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VAR_DB_TARGET: ${{ vars.DB_TARGET || 'server' }}
      # Túnel SSH desde el runner (DB_SOURCE=real): llave en el secret HATCH_KEY, destino en la variable
      # TUNNEL_SSH_TARGET (usuario@ip). La llave NUNCA va como archivo en el repo.
      HAS_HATCH_KEY: ${{ secrets.HATCH_KEY != '' }}
      TUNNEL_SSH_TARGET: ${{ vars.TUNNEL_SSH_TARGET }}
      TUNNEL_REMOTE_PORT: ${{ vars.TUNNEL_REMOTE_PORT || '56432' }}
      # Resumen con IA en las dos corridas programadas (07:00 y 15:00); manuales: variable LLM_ENABLED
      LLM_ENABLED: ${{ github.event_name == 'schedule' && 'true' || vars.LLM_ENABLED || 'true' }}
      SCOPE: ${{ inputs.scope || vars.SCOPE || 'all' }}
      # Corridas programadas envían de verdad (SCHEDULE_DRY_RUN=true las pone en simulacro); manuales: input dry_run
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.SCHEDULE_DRY_RUN || 'false' }}
      # Turno para la idempotencia: un envío por persona por turno (am/pm); cada corrida manual es su propio turno
      SR_SLOT: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 21 * * 1-5' && 'pm' || 'am') || format('manual-{0}', github.run_id) }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_ID }}
      REDIRECT_TELEGRAM_CHAT_ID: ${{ secrets.REDIRECT_TELEGRAM_CHAT_ID }}
      RECIPIENTS_YAML: ${{ secrets.RECIPIENTS_YAML }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Abrir túnel SSH a la BD del curso (DB_SOURCE=real)
        if: env.DB_SOURCE == 'real'
        shell: bash
        env:
          HATCH_KEY: ${{ secrets.HATCH_KEY }}
        run: |
          set -euo pipefail
          if [ "$HAS_HATCH_KEY" != "true" ]; then echo "::error::DB_SOURCE=real requiere el secret HATCH_KEY (contenido de .hatch_key)"; exit 1; fi
          if [ -z "$TUNNEL_SSH_TARGET" ]; then echo "::error::Define la variable TUNNEL_SSH_TARGET (usuario@ip)"; exit 1; fi
          if [ -z "$DATABASE_URL" ]; then echo "::error::Falta el secret DATABASE_URL"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HATCH_KEY" | tr -d '\r' > ~/.ssh/hatch_key
          chmod 600 ~/.ssh/hatch_key
          ssh -fN -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
              -i ~/.ssh/hatch_key -L "15432:127.0.0.1:${TUNNEL_REMOTE_PORT}" "$TUNNEL_SSH_TARGET"
          for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/15432) 2>/dev/null && break; sleep 1; done
          (echo > /dev/tcp/127.0.0.1/15432) 2>/dev/null || { echo "::error::El túnel no abrió el puerto 15432"; exit 1; }
          URL=$(python -c "import os; from sqlalchemy.engine import make_url; print(make_url(os.environ['DATABASE_URL']).set(host='127.0.0.1', port=15432).render_as_string(hide_password=False))")
          echo "::add-mask::$URL"
          echo "DATABASE_URL_LOCAL=$URL" >> "$GITHUB_ENV"
          echo "DB_TARGET=local" >> "$GITHUB_ENV"
          echo "Túnel abierto: 127.0.0.1:15432 -> servidor del curso"

      - name: BD demo sintética (DB_SOURCE=demo)
        if: env.DB_SOURCE == 'demo'
        run: python scripts/seed_demo_db.py

      - name: Destinatarios desde secret RECIPIENTS_YAML
        if: env.RECIPIENTS_YAML != ''
        shell: bash
        run: |
          printf '%s' "$RECIPIENTS_YAML" > config/recipients.local.yaml
          echo "RECIPIENTS_FILE=config/recipients.local.yaml" >> "$GITHUB_ENV"

      - name: Restaurar bitácora de envíos (idempotencia entre corridas)
        uses: actions/cache/restore@v4
        with:
          path: runs/ledger.json
          key: sr-ledger-${{ github.run_id }}
          restore-keys: sr-ledger-

      - name: Ejecutar agentes
        shell: bash
        env:
          AS_OF: ${{ inputs.as_of }}
          AUDIT_SOURCE: ${{ format('sr-{0}', github.event_name == 'schedule' && 'schedule' || 'manual') }}
          AUDIT_FILE_LOG: "0"        # la auditoría va a la BD; no se sube como artefacto público
        run: |
          if [ "$DB_SOURCE" = "demo" ]; then unset DB_URL DATABASE_URL DATABASE_URL_LOCAL; fi
          export DB_TARGET="${DB_TARGET:-$VAR_DB_TARGET}"
          ARGS=""
          # El input viaja por variable de entorno (no se interpola en el script) y se valida su formato
          if [ -n "$AS_OF" ]; then
            [[ "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::as_of inválido"; exit 1; }
            ARGS="--as-of $AS_OF"
          fi
          python main.py $ARGS

      - name: Cerrar túnel y borrar llave
        if: always()
        shell: bash
        run: |
          pkill -f "ssh -fN" 2>/dev/null || true
          rm -f ~/.ssh/hatch_key

      - name: Guardar bitácora de envíos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runs/ledger.json
          key: sr-ledger-${{ github.run_id }}

      - name: Resumen de la corrida
        if: always()
        shell: bash
        run: |
          python - <<'PY' || true
          import glob, json, os
          d = sorted(glob.glob("runs/20*/"))[-1] if glob.glob("runs/20*/") else None
          if d:
              z = json.load(open(d + "zeus.json")) if os.path.exists(d + "zeus.json") else {"deliveries": []}
              c = json.load(open(d + "cronos.json"))["signal"] if os.path.exists(d + "cronos.json") else {}
              st = {}
              for x in z.get("deliveries", []):
                  st[x["status"]] = st.get(x["status"], 0) + 1
              t = json.load(open(d + "thanatos.json")) if os.path.exists(d + "thanatos.json") else {}
              nar = [x.get("narrative", {}) for x in t.get("project_reports", []) + t.get("rollups", [])]
              llm = [n for n in nar if n.get("source") == "llm"]
              ru = [x.get("narrative", {}) for x in t.get("rollups", [])]
              ru_llm = [n for n in ru if n.get("source") == "llm"]
              sample = (ru_llm[0]["text"] if ru_llm else "").replace("\n", " ")[:220]
              print(f"::notice title=SR {os.environ.get('SR_SLOT')}::BD={os.environ.get('DB_SOURCE')} · dry_run={os.environ.get('DRY_RUN')} · "
                    f"Cronos={c.get('status')} ({c.get('records_in')} proyectos) · entregas {st} · "
                    f"IA {len(llm)}/{len(nar)} narrativas (roll-ups enviados por Telegram: {len(ru_llm)}/{len(ru)}) · ejemplo: {sample}")
          PY
          f=$(ls runs/*/failure_report.md 2>/dev/null | tail -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Publicar snapshots, outbox y reporte de fallas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sr-run-${{ github.run_number }}
          path: runs/
          retention-days: 30
