name: Diagnóstico del servidor del curso

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TUNNEL_SSH_TARGET: ${{ vars.TUNNEL_SSH_TARGET }}
    steps:
      - name: Preparar llave
        shell: bash
        env:
          HATCH_KEY: ${{ secrets.HATCH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HATCH_KEY" | tr -d '\r' > ~/.ssh/hatch_key && chmod 600 ~/.ssh/hatch_key

      - name: Diagnóstico SFTP (solo lectura)
        shell: bash
        run: |
          set +e
          cat > batch.txt <<'EOS'
          pwd
          ls -la
          ls -la *
          EOS
          sftp -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 -i ~/.ssh/hatch_key -b batch.txt "$TUNNEL_SSH_TARGET" > probe.txt 2>&1
          echo "sftp_exit=$?" >> probe.txt
          { echo '```'; head -c 60000 probe.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Borrar llave
        if: always()
        run: rm -f ~/.ssh/hatch_key
