# Configuración general (SIN secretos). Las variables de entorno sobrescriben estos valores.
db:
  url: "sqlite:///data/demo_spm.db"   # env: DB_URL
  connect_timeout_s: 30
  retries: 3
  backoff_s: [5, 15, 45]

# Alcance por defecto: "all" o lista de "project:<number>", "program:<number>", "portfolio:<number>"
scope: ["all"]                        # env: SCOPE (separado por comas)

dq:
  stale_sr_days: 7                    # DQ-02 (SUPUESTO)

llm:
  enabled: true                       # requiere env ANTHROPIC_API_KEY; sin llave usa plantilla
  model: "claude-sonnet-5-5"          # env: LLM_MODEL
  max_tokens: 400
  thinking: "between_tools"           # desactiva el razonamiento extendido: evita respuestas vacías por max_tokens
  max_calls: 60                       # por corrida; cubre todos los roll-ups (PgM/PfM) del dataset del curso

security:                             # Cerbero (agente de seguridad) — ver docs/plan/12_Seguridad_Cerbero.md
  max_message_len: 300                # mensajes de Telegram más largos se bloquean
  rate_per_min: 12                    # peticiones por chat por minuto
  strikes_to_quarantine: 3            # bloqueos en 10 min que ponen al chat en cuarentena
  quarantine_min: 30
  field_max_len: 400                  # campos de texto de la BD se recortan a esta longitud
  halt_ratio: 0.2                     # si >20 % de los registros traen contenido malicioso, se detiene la corrida

notifications:
  dry_run: true                       # env: DRY_RUN (true/false). true = no envía, guarda en outbox
  # Canal único: Telegram (correo retirado 2026-10-18 por falta de SMTP)
  telegram_enabled: true
  telegram_min_interval_s: 1.1        # ritmo de envío (Telegram limita ~1 msg/s por chat)
  telegram_include_costs: false       # privacidad: costos solo por correo
  admin_telegram_chat_id: ""          # env: ADMIN_TELEGRAM_CHAT_ID
  redirect_telegram_chat_id: ""       # env: REDIRECT_TELEGRAM_CHAT_ID (pruebas: todo llega a este chat)

runs_dir: "runs"                      # env: RUNS_DIR
recipients_file: "config/recipients.yaml"  # env: RECIPIENTS_FILE
schema_map: "config/schema_map.yaml"
thresholds: "config/thresholds.yaml"
